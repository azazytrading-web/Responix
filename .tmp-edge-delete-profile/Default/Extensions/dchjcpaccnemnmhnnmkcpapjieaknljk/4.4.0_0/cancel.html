<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Donation Canceled</title>
    <link rel="stylesheet" href="./css/donate.css" />
    <style>
        .center-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #e74c3c;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
<div class="center-page">
    <h2>Donation Canceled</h2>
    <p>The donation was not completed.</p>
    <p>If this was a mistake, you can try again anytime.</p>
    <button class="btn" id="closeBtn">Close</button>
    <p id="manual-msg" style="display:none; font-size: 14px; margin-top: 10px; color: #666;">
        You can now close this tab manually.
    </p>
    <script type="module" src="close-handler.js"></script>
</div>
</body>
</html>
