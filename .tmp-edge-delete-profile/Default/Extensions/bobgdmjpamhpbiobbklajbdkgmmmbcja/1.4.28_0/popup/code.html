<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DualSafe Password Manager</title>
    <link href="../skin/icons/log_icon_24.png" rel="shortcut icon">
    <link rel="stylesheet" href="../css/fail.css">
</head>

<body id="codebody" class="codebody">
    <div class="code-container">
        <div>
            <div class="code-inner">
                <div class="code-icon"><img src="./images/logo_120.svg" width="120" height="120" alt=""></div>
                <h3 class="dpm-name" data-properties="appName">DualSafe Password Manager</h3>
                <h2 class="code-title" data-properties="code_pairing_title">Your Pairing Code</h2>
                <p class="code-desc" data-properties="code_pairing_desc">Check and confirm popup for DualSafe Password Manager
                    Desktop App</p>
                <div class="code-list">
                    <b class="code-number">1</b>
                    <b class="code-number">2</b>
                    <b class="code-number">3</b>
                    <b class="code-number">4</b>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="../polyfill/polyfill-firefox.js"></script>
<script src="./message.js"></script>
<script src="../uri2color.js"></script>
<script src="./code.js"></script>
</html>
