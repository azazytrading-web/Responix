<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Support Prayer Times Extension</title>
    <link rel="stylesheet" href="./css/donate.css">
</head>
<body>
<div class="container">

    </div>
</div>

<script src="donate.js"></script>
</body>
</html>
