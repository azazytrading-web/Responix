<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DualSafe Password Manager</title>
    <link rel="stylesheet" href="../../css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/tooltipster.bundle.min.css">
    <link rel="stylesheet" href="../../css/toastr.min.css">
    <link rel="stylesheet" href="../../css/tagify.css">
    <link rel="stylesheet" type="text/css" href="../../css/confirm.css" />
</head>

<body class="confirm-body" style="overflow: hidden;">
    <div id="confirm-container" class="confirm-container"></div>

    <div class="modal fade ips-modal" id="confirmEditModalPopovers" tabindex="-1" aria-labelledby="showModalLabel"
        aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="confirm-icon">
                        <div class="website-icon" style="background-image: url(../images/ico_window_issue.png)"></div>
                    </div>
                    <div class="confirm-info">
                        <div class="modal-title" data-properties="discard_change">Are you sure to discard the unsaved changes?</div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button id="canelConfirmBtn" type="button" class="button-css  button-gray button-small"
                        data-bs-dismiss="modal" data-properties="cancel">
                        Cancel
                    </button>
                    <button id="missConfirmBtn" type="button"
                        class="button-css button-blue button-yes  button-small" data-bs-dismiss="modal" data-properties="discard">Discard</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade ips-modal" id="confirmDeletePopovers" tabindex="-1" aria-labelledby="editDeleteLabel"
        aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="confirm-info">
                        <div class="confirm-icon">
                            <div class="website-icon" style="background-image: url(../images/ico_window_issue.png)">
                            </div>
                        </div>
                        <div class="modal-title"><span class="delete-desc" data-properties="delete_item">Are you sure to delete this item to Deleted Items?</span> </div>
                    </div>
                    <p class="modal-tips" data-properties="delete_item_dec">
                        You can restore it from the Deleted Items as long as it is not permanently deleted.
                    </p>
                </div>
                <div class="modal-footer">
                    <button id="deleteCancelButton" type="button" class="button-css  button-gray button-small"
                        data-bs-dismiss="modal" data-properties="cancel">Cancel</button>
                    <button id="deleteConfirmButton" type="button"
                        class="button-css button-blue  button-small button-delete remove-confirm-btn"
                        data-bs-dismiss="modal" aria-label="Close" controls-id="" data-properties="delete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div class="svg-div" style="display:none;">
        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" style="display:none;">
            <symbol id="ico_tab_tag" viewBox="0 0 25 25">
                <g transform="translate(-2767.812 -2811.639)" stroke="">
                    <path
                        d="M2787.341 2828.223l-4.822 3.588a2.161 2.161 0 0 1-3.023-.443l-5.6-7.525a2.939 2.939 0 0 1-.537-2.259l.676-3.85a2.047 2.047 0 0 1 2.257-1.679l3.882.459a2.935 2.935 0 0 1 2.01 1.162l5.6 7.526a2.159 2.159 0 0 1-.443 3.021z"
                        stroke-width="1.5" />
                    <circle cx="1.8" cy="1.8" r="1.8" transform="translate(2776.863 2819.691)" stroke-width="1.76" />
                </g>
            </symbol>
            <symbol id="ico_tag_small" viewBox="0 0 16 16">
                <defs>
                    <clipPath id="a">
                        <path transform="translate(460 552)" stroke="#707070" d="M0 0h16v16H0z" />
                    </clipPath>
                </defs>
                <g transform="translate(-460 -552)" clip-path="url(#a)">
                    <path
                        d="M474.07 560.902l-4.759-6.4a2.494 2.494 0 0 0-1.708-.988l-3.3-.39a1.739 1.739 0 0 0-1.918 1.427l-.574 3.272a2.5 2.5 0 0 0 .455 1.92l4.761 6.4a1.836 1.836 0 0 0 2.569.376l4.1-3.05a1.835 1.835 0 0 0 .374-2.567zm-6.839-1.926a1.53 1.53 0 1 1 .314-2.141 1.529 1.529 0 0 1-.314 2.14z" />
                </g>
            </symbol>
        </svg>
    </div>
    <script src="../../polyfill/polyfill-firefox.js"></script>
    <script src="../../popup/js/jquery-3.6.0.min.js"></script>
    <script src="../../popup/js/bootstrap.bundle.min.js"></script>
    

    <script src="../../popup/js/vendor/jquery-selectBox.js"></script>
    <script src="../../popup/js/vendor.js"></script>
    <script src="../../popup/js/vendor/clipboard.js"></script>
    <script src="../../popup/js/vendor/fuse.js"></script>
    <script src="../../popup/js/vendor/jq-pause.js"></script>
    <script src="../../popup/js/vendor/jq-easing.js"></script>
    <script src="../../popup/js/vendor/jquery.marquee.js"></script>
    <script src="../../popup/js/vendor/validator.js"></script>

   
    <script src="../../popup/js/tooltipster.bundle.min.js"></script>
    <script src="../../popup/js/toastr.min.js"></script>
    <script src="../../tagify.js"></script>
    <script src="../../popup/js/injectpopupcomm.js"></script>
    <script src="../../uri2color.js"></script>
    <script src="../../check-totp.js"></script>
    <!-- <script src="../../popup/customtags.js"></script> -->
    <script src="../js/confirmhandle.js"></script>
    <script src="../js/confirmtags.js"></script>
    <script src="../js/confirm.js"></script>
</body>

</html>
