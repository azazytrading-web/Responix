services:
  oic-postgres:
    image: pgvector/pgvector:pg16
    container_name: oic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OIC_POSTGRES_DB:-oic}
      POSTGRES_USER: ${OIC_POSTGRES_USER:-oic}
      POSTGRES_PASSWORD: ${OIC_POSTGRES_PASSWORD:?Set a dedicated OIC database password}
    volumes:
      - oic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: responix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-responix}
      POSTGRES_USER: ${POSTGRES_USER:-responix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-responix_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: responix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: responix-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    environment:
      API_HOST: 0.0.0.0
      OIC_BASE_URL: http://oic-api:4100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      oic-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:4000/api/v1/health'').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  oic-api:
    build:
      context: .
      dockerfile: apps/oic-api/Dockerfile
    container_name: oic-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      OIC_PORT: 4100
      OIC_POSTGRES_USER: ${OIC_POSTGRES_USER:-oic}
      OIC_POSTGRES_PASSWORD: ${OIC_POSTGRES_PASSWORD:?Set a dedicated OIC database password}
      OIC_POSTGRES_DB: ${OIC_POSTGRES_DB:-oic}
      OIC_DATABASE_URL: postgresql://${OIC_POSTGRES_USER:-oic}:${OIC_POSTGRES_PASSWORD:?Set a dedicated OIC database password}@oic-postgres:5432/${OIC_POSTGRES_DB:-oic}?schema=public
    depends_on:
      oic-migrate:
        condition: service_completed_successfully
    expose:
      - "4100"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:4100/api/v1/health/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  oic-migrate:
    build:
      context: .
      dockerfile: apps/oic-api/Dockerfile
      target: migrate
    environment:
      OIC_POSTGRES_USER: ${OIC_POSTGRES_USER:-oic}
      OIC_POSTGRES_PASSWORD: ${OIC_POSTGRES_PASSWORD:?Set a dedicated OIC database password}
      OIC_POSTGRES_DB: ${OIC_POSTGRES_DB:-oic}
      OIC_DATABASE_URL: postgresql://${OIC_POSTGRES_USER:-oic}:${OIC_POSTGRES_PASSWORD:?Set a dedicated OIC database password}@oic-postgres:5432/${OIC_POSTGRES_DB:-oic}?schema=public
    depends_on:
      oic-postgres:
        condition: service_healthy
    restart: "no"

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: responix-dashboard
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000'').then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  oic_postgres_data:
  redis_data:
